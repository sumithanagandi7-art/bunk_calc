version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bunk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bunk_calculator
      POSTGRES_USER: bunk_user
      POSTGRES_PASSWORD: bunk_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunk_user -d bunk_calculator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (Database UI) ────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bunk_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bunkcalc.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bunk_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://bunk_user:bunk_pass@postgres:5432/bunk_calculator"
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecret_change_in_production_min32chars}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-anothersecret_change_in_production_min32}
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm start"

  # ── Frontend (production build served by Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bunk_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Automated Backup (nightly pg_dump) ───────────────────────────────────────
  backup:
    image: postgres:15-alpine
    container_name: bunk_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: bunk_pass
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      sh -c '
        while true; do
          FILENAME="/backups/bunk_$(date +%Y%m%d_%H%M%S).sql"
          pg_dump -h postgres -U bunk_user bunk_calculator > "$$FILENAME"
          echo "Backup created: $$FILENAME"
          # Keep only last 7 backups
          ls -t /backups/*.sql | tail -n +8 | xargs -r rm
          sleep 86400  # 24 hours
        done
      '

volumes:
  pgdata:
  pgadmin_data:

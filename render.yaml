services:
  # ── Backend API Web Service (Fast Node.js runtime with Sharp OCR) ──
  - type: web
    name: bunk-calculator-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bunk-calculator-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434

databases:
  # ── Render Managed PostgreSQL Database ────────────────────────
  - name: bunk-calculator-db
    databaseName: bunk_calculator
    user: bunk_user
    plan: free
    region: oregon

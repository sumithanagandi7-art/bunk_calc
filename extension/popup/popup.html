<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunk Calculator Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6C63FF"/>
              <stop offset="100%" stop-color="#00D2FF"/>
            </linearGradient>
          </defs>
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span class="logo-title">BunkCalc <span class="badge-tag">SYNC</span></span>
      </div>
      <div class="header-status">
        <span id="server-dot" class="status-dot offline"></span>
        <span id="server-text" class="status-label">Checking...</span>
      </div>
    </header>

    <!-- Access Code Config Card -->
    <div class="card config-card" id="config-card">
      <div class="config-row">
        <input type="text" id="access-code-input" placeholder="Enter Access Code (e.g. BUNK-5998)" autocomplete="off" />
        <button id="save-code-btn" class="btn-sm">Connect</button>
      </div>
      <p class="config-hint">Connects to your Bunk Calculator workspace session.</p>
    </div>

    <!-- Sync Action Card -->
    <div class="card sync-card">
      <button id="sync-btn" class="btn-sync">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
          <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/>
        </svg>
        <span id="sync-btn-text">Sync Portal Attendance</span>
      </button>
      <div class="sync-info">
        <span id="tab-status">Detecting portal page...</span>
        <span id="last-sync-time" class="last-sync">Last synced: Never</span>
      </div>
    </div>

    <!-- Subjects Bunk View -->
    <div class="section-title">
      <span>Subject Attendance & Bunks</span>
      <span id="subject-count" class="count-pill">0</span>
    </div>

    <div id="subjects-container" class="subjects-list">
      <div class="empty-state">
        <p>No subjects synced yet.</p>
        <p class="sub-text">Open your college portal & click "Sync Portal Attendance".</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="http://localhost:3000" target="_blank" id="open-dashboard-link" class="footer-link">
        Open Full BunkCalc Dashboard ↗
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
